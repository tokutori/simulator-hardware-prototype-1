[workspace]
members = [
    "crates/gimbal-core",
    "crates/gimbal-kernel-manifold",
    "crates/gimbal-export",
    "crates/gimbal-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
libm = "0.2.15"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
