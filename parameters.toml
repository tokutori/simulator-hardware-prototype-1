# Nominal test geometry. Dimensions are millimetres and angles are degrees.

[spur_stage]
module_mm = 1.25
pressure_angle_deg = 20.0
handle_teeth = 18
reduction_large_teeth = 36
reduction_small_teeth = 18
output_teeth = 40
face_width_mm = 3.5
tooth_backlash_mm = 0.10
chord_tolerance_mm = 0.05

[rack_stage]
normal_module_mm = 2.0
normal_pressure_angle_deg = 20.0
helix_angle_deg = 15.0
pinion_teeth = 20
rack_teeth = 24
face_width_mm = 20.0
