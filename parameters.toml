# Nominal test geometry. Dimensions are millimetres and angles are degrees.

[spur_stage]
module_mm = 1.8
pressure_angle_deg = 25.0
handle_teeth = 12
reduction_large_teeth = 31
reduction_small_teeth = 12
output_teeth = 28
face_width_mm = 3.5
# B/C output gears grow upward to match the already-extended D-small gear.
output_face_width_mm = 5.5
# Per-member tooth-thickness reduction. Two members at 0.10 mm give about
# 0.20 mm nominal mesh backlash; tune this with an FDM coupon.
tooth_backlash_mm = 0.10
chord_tolerance_mm = 0.05

[rack_stage]
normal_module_mm = 2.0
normal_pressure_angle_deg = 20.0
helix_angle_deg = 15.0
pinion_teeth = 20
rack_teeth = 24
# Keep the pinions wide for strength; the rack is narrower to leave axial
# observation clearance below the top plate.
face_width_mm = 20.0
rack_face_width_mm = 15.0
center_gap_mm = 0.0
pinion_lower_extension_mm = 2.0
rack_body_thickness_mm = 8.0
# Applied independently to the pinion and rack tooth thicknesses.
tooth_backlash_mm = 0.10
chord_tolerance_mm = 0.05
slices_per_half = 12

[handle]
crank_radius_mm = 40.0

# M6x40 bolts clamp the frame. Printed hollow axles carry the rotating parts and
# also maintain the gap between the two printed frame plates.
[hardware]
bolt_length_mm = 40.0
bolt_clearance_diameter_mm = 6.4
printed_journal_outer_diameter_mm = 10.0
rotating_bore_diameter_mm = 10.4
thrust_spacer_outer_diameter_mm = 15.0
nut_across_flats_mm = 10.4
nut_thickness_mm = 5.0
nut_pocket_depth_mm = 3.0
plate_thickness_mm = 4.0
plate_length_mm = 130.0
plate_width_mm = 130.0
plate_center_y_mm = -14.3
corner_bolt_inset_mm = 12.0
axial_clearance_mm = 0.5
top_socket_depth_mm = 2.0
top_socket_axial_clearance_mm = 0.5
top_socket_diameter_clearance_mm = 0.5
